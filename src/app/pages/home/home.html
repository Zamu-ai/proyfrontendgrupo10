<div class="container mt-5 mb-5">

  <div class="row justify-content-center mb-5 mt-4">
    <div class="col-md-8 text-center">
      <h1 class="mb-4 fw-bold custom-text-shadow">
        ¡Empezá buscando un juego!
      </h1>
      <!--- Contenedor clave para que la lista de sugerencias pueda flotar sobre el resto de la página. Si no estuviera, el menú flotante se cortaría al llegar al borde del contenedor padre. --->
      <div class="position-relative">
        
        <div class="p-1 rounded-pill custom-neon-border">
          <div class="input-group input-group-lg">
            <!-- #inputBuscador agarra lo que el usuario escribe y el evento keyup avisa al TS para que debounce haga su magia -->
            <input #inputBuscador (keyup)="buscarSugerencias(inputBuscador.value)" type="text" class="form-control border-0 rounded-start-pill font-monospace ps-4 custom-input" placeholder="Buscar juegos por título..." aria-label="Buscar juegos">
            <button class="btn btn-info text-dark fw-bold text-uppercase border-0 rounded-end-pill px-5 custom-btn" type="button" style="letter-spacing: 2px;">BUSCAR</button>
          </div>
        </div>

        <!--- el ngIf oculta la lista hasta que los datos llegan y el z-index: 1000 asegura que las sugerencias queden por encima de los demas elementos --->
        <ul *ngIf="mostrarSugerencias && sugerenciasBusqueda.length > 0" class="list-group position-absolute w-100 mt-2 shadow-lg" style="z-index: 1000; text-align: left;">
          
          <li *ngFor="let sugerencia of sugerenciasBusqueda" 
              class="list-group-item list-group-item-action d-flex align-items-center"
              style="cursor: pointer;"
              (click)="seleccionarSugerencia(sugerencia)">
            
            <img [src]="sugerencia.imagen_portada" width="35" height="45" class="me-3 rounded object-fit-cover" [alt]="sugerencia.titulo">
            <span class="fw-bold">{{ sugerencia.titulo }}</span>
            
          </li>
          
        </ul>

      </div>
      
    </div>
  </div>

  <div class="row justify-content-center mb-5">
    <div class="col-lg-10">
      <h3 class="mb-3" style="text-align: center;">Ultimos juegos buscados</h3>
      
      <div id="carruselJuegos" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner rounded shadow-sm">
          
          <!-- NgFor para iterar sobre los juegos destacados -->
          <!-- La condición [class.active]="i === 0" es clave para que el carrusel funcione -->
          <div *ngFor="let destacado of juegosDestacados; let i = index" 
          class="carousel-item" 
          [class.active]="i === 0">
            <a [routerLink]="['/juego/detalle', destacado.id]">
              <img [src]="destacado.imagen" class="d-block w-100" [alt]="destacado.titulo">
              <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-75 rounded p-2">
                <h5>{{ destacado.titulo }}</h5>
                <p class="mb-0 text-success fw-bold">{{ destacado.descuento }} | {{ destacado.precio }}</p>
              </div>
            </a>
          </div>
          
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carruselJuegos" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carruselJuegos" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Siguiente</span>
        </button>
      </div>

    </div>
  </div>

  <div class="row mb-4">
    <div class="col-12">
      <h3 class="mb-3" >Más jugados este mes</h3>
    </div>
  </div>

  <!-- En la etiqueta de img, le puse la clase de .custom-card-img porque las portadas de la API vienen de distinto tamaño
  y resolución, en el css recorto y fuerzo una altura fija -->
  <div class="row row-cols-2 row-cols-md-4 row-cols-lg-5 g-4">
    
    <div class="col" *ngFor="let juego of catalogoGeneral">
      <a [routerLink]="['/juego/detalle', juego.id]" class="card-link">
        <div class="card h-100 bg-body-tertiary border-secondary shadow-sm">
          <img [src]="juego.imagen" class="card-img-top" [alt]="juego.titulo">
          <div class="card-body">
            <h5 class="card-title">{{ juego.titulo }}</h5>
            <p class="card-text text-muted small">{{ juego.categoria }}</p>
          </div>
          <div class="card-footer border-secondary d-flex justify-content-between align-items-center">
            <span class="badge" [ngClass]="juego.descuento === 'Free' ? 'bg-primary' : 'bg-success'">{{ juego.descuento }}</span>
            <span class="fw-bold">{{ juego.precio }}</span>
          </div>
        </div>
      </a>
    </div>
    
  </div>

</div>
