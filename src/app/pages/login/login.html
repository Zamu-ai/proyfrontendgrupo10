<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="row w-100 justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card bg-dark text-white shadow-lg border-0 rounded-4">
        <div class="card-body p-5 text-center">

          <div class="mb-md-4 mt-md-2">
            <h2 class="fw-bold mb-2 text-uppercase text-info">¡Bienvenido, Gamer!</h2>
            <p class="text-white-50 mb-4">Por favor, ingresa tu usuario y contraseña</p>

            <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
              
              <div class="form-outline form-white mb-4 text-start">
                <label class="form-label text-info" for="username">Nombre de Usuario</label>
                <input type="text" id="username" formControlName="username" class="form-control form-control-lg bg-secondary text-white border-0" placeholder="Ej: pablito_gamer" />
                
                <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" class="text-danger small mt-1">
                  El usuario es obligatorio (mínimo 4 caracteres).
                </div>
              </div>

              <div class="form-outline form-white mb-4 text-start">
                <label class="form-label text-info" for="password">Contraseña</label>
                <input type="password" id="password" formControlName="password" class="form-control form-control-lg bg-secondary text-white border-0" placeholder="••••••••" />
                
                <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger small mt-1">
                  La contraseña es obligatoria (mínimo 6 caracteres).
                </div>
              </div>

              <button class="btn btn-outline-info btn-lg px-5 w-100 mt-3 fw-bold text-uppercase" type="submit">
                Ingresar
              </button>
            </form>

          </div>

          <div>
            <p class="mb-0 text-white-50">¿No tienes cuenta? 
              <a href="/Registro" class="text-info fw-bold style-link">Regístrate aquí</a>
            </p>
          </div>
          <div class="mt-3">
              <p class="text-white-50 mb-2">O inicia sesion con Google</p>
              <button class="btn btn-outline-danger w-100" (click)="loguearConGoogle()">
                <i class="bi bi-google"></i>
              </button>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
