<div class="container d-flex justify-content-center align-items-center min-vh-100 my-4">
  <div class="row w-100 justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card bg-dark text-white shadow-lg border-0 rounded-4">
        <div class="card-body p-5 text-center">

          <div class="mb-md-2 mt-md-2">
            <h2 class="fw-bold mb-2 text-uppercase text-info">Crear Cuenta</h2>
            <p class="text-white-50 mb-4">Únete a la comunidad gamer más grande</p>

            <form [formGroup]="registroForm" (ngSubmit)="onRegistro()">

              <div class="row">
                <div class="col-12 col-md-6 mb-3 text-start">
                  <label class="form-label text-info" for="nombre">Nombre</label>
                  <input type="text" id="nombre" formControlName="nombre"
                    class="form-control bg-secondary text-white border-0" placeholder="Ej: Pablo" />
                  <div *ngIf="registroForm.get('nombre')?.touched && registroForm.get('nombre')?.invalid"
                    class="text-danger small mt-1">Obligatorio.</div>
                </div>

                <div class="col-12 col-md-6 mb-3 text-start">
                  <label class="form-label text-info" for="apellido">Apellido</label>
                  <input type="text" id="apellido" formControlName="apellido"
                    class="form-control bg-secondary text-white border-0" placeholder="Ej: Gomez" />
                  <div *ngIf="registroForm.get('apellido')?.touched && registroForm.get('apellido')?.invalid"
                    class="text-danger small mt-1">Obligatorio.</div>
                </div>
              </div>

              <div class="mb-3 text-start">
                <label class="form-label text-info" for="username">Nombre de Usuario</label>
                <input type="text" id="username" formControlName="username"
                  class="form-control bg-secondary text-white border-0" placeholder="Ej: pablito_gamer" />
                <div *ngIf="registroForm.get('username')?.touched && registroForm.get('username')?.invalid"
                  class="text-danger small mt-1">Mínimo 4 caracteres.</div>
              </div>

              <div class="mb-3 text-start">
                <label class="form-label text-info" for="password">Contraseña</label>
                <input type="password" id="password" formControlName="password"
                  class="form-control bg-secondary text-white border-0" placeholder="••••••••" />
                <div *ngIf="registroForm.get('password')?.touched && registroForm.get('password')?.invalid"
                  class="text-danger small mt-1">Mínimo 6 caracteres.</div>
              </div>
              <div class="mb-3">
                <label class="form-label text-white">Correo Electrónico</label>
                <input type="email" formControlName="email" class="form-control" placeholder="ejemplo@correo.com">
              </div>

              <div class="mb-3">
                <label class="form-label text-white">URL de tu Foto de Perfil (Opcional)</label>
                <input type="text" formControlName="foto" class="form-control"
                  placeholder="http://imagen.com/mi-foto.jpg">
              </div>

              <!-- <div class="mb-4 text-start">
                <label class="form-label text-info" for="perfil">Tipo de Perfil</label>
                <select id="perfil" formControlName="perfil" class="form-select bg-secondary text-white border-0">
                  <option value="Usuario Normal">Usuario Normal</option>
                  <option value="Administrador">Administrador</option>
                </select>
              </div> -->
              <div class="mb-4">
                <label class="form-label text-info fw-bold d-block text-center mb-3">
                  🎮 SELECCIONA TU AVATAR GAMER
                </label>

                <div
                  class="d-flex justify-content-center gap-3 flex-wrap bg-dark bg-opacity-50 p-3 rounded border border-secondary">
                  <div *ngFor="let avatar of listaAvatares" (click)="seleccionarAvatar(avatar)"
                    class="position-relative p-1 rounded-circle border border-2"
                    [ngClass]="avatarSeleccionado === avatar ? 'border-info bg-info bg-opacity-25 shadow-lg' : 'border-transparent'"
                    style="cursor: pointer; transition: all 0.2s ease;">

                    <img [src]="avatar" alt="Avatar" class="rounded-circle object-fit-cover" width="65" height="65">

                    <span *ngIf="avatarSeleccionado === avatar"
                      class="position-absolute bottom-0 end-0 bg-info text-dark rounded-circle d-flex align-items-center justify-content-center fw-bold shadow"
                      style="width: 20px; height: 20px; font-size: 12px;">
                      ✓
                    </span>
                  </div>
                </div>
              </div>
              <button class="btn btn-outline-info btn-lg px-5 w-100 mt-2 fw-bold text-uppercase" type="submit">
                Registrarse
              </button>
            </form>

          </div>

          <div class="mt-4">
            <p class="mb-0 text-white-50">¿Ya tienes una cuenta?
              <a routerLink="/Login" class="text-info fw-bold style-link">Inicia sesión</a>
            </p>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
